version: 0.2.0
homepage: https://github.com/OmarYacop/sqlite_loom
repository: https://github.com/OmarYacop/sqlite_loom
issue_tracker: https://github.com/OmarYacop/sqlite_loom/issues

topics:
  - sqlite
  - database
  - reactive
  - persistence
  - sqflite

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  sqflite_common: ">=2.5.6 <3.0.0"

dev_dependencies:
  lints: ^6.1.0
  sqflite_common_ffi: ^2.4.2
  test: ^1.31.2
