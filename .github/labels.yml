# Canonical repository label taxonomy. Apply with:
#   dart run tool/sync_labels.dart --apply
- name: "area:ci"
  color: "e99695"
  description: "GitHub Actions, automation, and development tooling"
- name: "area:cli"
  color: "1d76db"
  description: "Command-line interface and project tooling"
- name: "area:core"
  color: "8250df"
  description: "Database lifecycle, execution, and transactions"
- name: "area:docs"
  color: "0075ca"
  description: "Documentation and examples"
- name: "area:governance"
  color: "c2e0c6"
  description: "Repository process, policies, and architecture decisions"
- name: "area:migrations"
  color: "336caf"
  description: "Migration runner and schema operations"
- name: "area:queries"
  color: "5319e7"
  description: "Typed models, expressions, relationships, and queries"
- name: "area:reactivity"
  color: "0e8a16"
  description: "Change invalidation and reactive query streams"
- name: "area:suite-integration"
  color: "006b75"
  description: "Compatibility with sqlite_loom_suite and downstream consumers"
- name: "breaking-change"
  color: "b60205"
  description: "Breaking change to a public API, migration contract, or behavior"
- name: "priority:p0"
  color: "b60205"
  description: "Critical: data integrity, security, or release blocker"
- name: "priority:p1"
  color: "d93f0b"
  description: "High priority"
- name: "priority:p2"
  color: "fbca04"
  description: "Normal priority"
- name: "priority:p3"
  color: "c5def5"
  description: "Low priority"
- name: "status:blocked"
  color: "d73a4a"
  description: "Blocked on a named dependency or decision"
- name: "status:needs-decision"
  color: "5319e7"
  description: "Needs an architecture or product decision"
- name: "status:needs-reproduction"
  color: "d876e3"
  description: "Cannot proceed without a minimal reproduction"
- name: "type:bug"
  color: "d73a4a"
  description: "Bug report; implementation branches use fix/"
- name: "type:build"
  color: "cfd3d7"
  description: "Build system or dependency tooling"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance or repository housekeeping"
- name: "type:ci"
  color: "e99695"
  description: "CI/CD and workflow changes"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation-only change"
- name: "type:feat"
  color: "1f883d"
  description: "New capability"
- name: "type:fix"
  color: "d73a4a"
  description: "Bug fix"
- name: "type:hotfix"
  color: "e11d21"
  description: "Urgent production or release fix"
- name: "type:perf"
  color: "fbca04"
  description: "Measured performance change"
- name: "type:refactor"
  color: "fbca04"
  description: "Refactor without intended behavior change"
- name: "type:release"
  color: "0e8a16"
  description: "Versioning, release notes, tags, or publication"
- name: "type:security"
  color: "b60205"
  description: "Security-relevant change"
- name: "type:test"
  color: "c5def5"
  description: "Test-only change"
