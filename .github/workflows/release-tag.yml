name: Release Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up stable Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Match tag to pubspec version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dart run tool/ci.dart tag "$RELEASE_TAG"
      - name: Run release checks
        run: ./tool/ci all
